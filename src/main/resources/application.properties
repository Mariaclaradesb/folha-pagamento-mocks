spring.application.name=folha-pagamento
spring.datasource.url=jdbc:h2:mem:folha;DB_CLOSE_DELAY=-1
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false

# Regras fictícias de cálculo; podem ser sobrescritas por variáveis de ambiente.
folha.aliquota-inss=${FOLHA_ALIQUOTA_INSS:0.10}
folha.aliquota-ir=${FOLHA_ALIQUOTA_IR:0.05}
folha.isencao-ir=${FOLHA_ISENCAO_IR:2000.00}
